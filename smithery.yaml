name: stresszero-mcp
description: "MCP server for StressZero Intelligence API — Burnout prevention self-assessment across 3 dimensions (physical, emotional, effectiveness) — indicative, non-medical"
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: "Your StressZero API key (get free at stresszeroentrepreneur.fr/intelligence-api)"
    required:
      - apiKey
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "stresszero-mcp"],
      env: {
        STRESSZERO_API_KEY: config.apiKey
      }
    })
